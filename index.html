<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="./src/output.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">


    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Create Account
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Register to get started
        </p>

        <form id="registrationForm">


            <div class="mb-5">

                <label class="block font-semibold text-gray-700 mb-2">
                    Name
                </label>

                <input type="text" id="name" placeholder="Enter your name"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-yellow-500">

                <p id="nameError" class="text-red-500 text-sm mt-1"></p>

            </div>



            <div class="mb-5">

                <label class="block font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input type="text" id="email" placeholder="Enter your email"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-yellow-500">

                <p id="emailError" class="text-red-500 text-sm mt-1"></p>

            </div>



            <div class="mb-5">

                <label class="block font-semibold text-gray-700 mb-2">
                    Password
                </label>

                <input type="password" id="password" placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-yellow-500">

                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>

            </div>



            <div class="mb-5">

                <label class="block font-semibold text-gray-700 mb-2">
                    Bio
                </label>

                <textarea id="bio" maxlength="200" placeholder="Write something about yourself..."
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-yellow-500 resize-none h-28"></textarea>

                <div class="flex justify-between items-center">

                    <p id="bioError" class="text-red-500 text-sm"></p>

                    <p id="counter" class="text-gray-500 text-sm">
                        0 / 200 characters
                    </p>

                </div>

            </div>



            <button type="submit" id="submitBtn" disabled
                class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg disabled:bg-gray-400 disabled:cursor-not-allowed enabled:hover:bg-blue-700 transition">
                Register
            </button>



            <p id="successMessage" class="text-green-600 text-center font-semibold mt-4"></p>

        </form>

    </div>

    <script>

        const username = document.getElementById('name')
        const email = document.getElementById('email');
        const password = document.getElementById('password')
        const bio = document.getElementById('bio')

        const nameError = document.getElementById('nameError')
        const emailError = document.getElementById('emailError')
        const passwordError = document.getElementById('passwordError')
        const bioError = document.getElementById('bioError')


        const form = document.getElementById('registrationForm')
        const submitBtn = document.getElementById('submitBtn')
        const successMessage = document.getElementById('successMessage')
        const counter = document.getElementById('counter')





        function namecheck() {
            if (username.value.trim() === '') {
                nameError.textContent = 'Name is required';
                return false;
            }
            else {
                nameError.textContent = '';
                return true;
            }
        }


        function emailcheck() {
            const emailValue = email.value.trim();

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailValue === '') {
                emailError.textContent = 'Email is required';
                return false;
            } else if (!emailRegex.test(emailValue)) {
                emailError.textContent = 'Please enter a valid email address';
                return false;
            } else {
                emailError.textContent = "";
                return true;
            }


        }


        function passwordcheck() {
            if (password.value.trim() === '') {
                passwordError.textContent = 'Password is required';
                return false;
            }
            else if (password.value.trim().length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters long';
                return false;
            }
            else {
                passwordError.textContent = '';
                return true;
            }
        }


        function biocheck() {
            if (bio.value.trim() === '') {
                bioError.textContent = 'Bio is required';
                return false;
            }
            else {
                bioError.textContent = '';
                return true;
            }
        }


        bio.addEventListener('input', function () {
            counter.textContent = bio.value.length + ' / 200 characters';
        });



        function checkFormValidity() {

            const isNameValid = namecheck();
            const isEmailValid = emailcheck();
            const isPasswordValid = passwordcheck();
            const isBioValid = biocheck();


            if (isNameValid && isEmailValid && isPasswordValid && isBioValid) {
                submitBtn.disabled = false;

            } else {
                submitBtn.disabled = true;
            }
        }


        username.addEventListener('input', checkFormValidity);
        email.addEventListener('input', checkFormValidity);
        password.addEventListener('input', checkFormValidity);
        bio.addEventListener('input', checkFormValidity);



        form.addEventListener('submit', function (event) {
            event.preventDefault();

            successMessage.textContent = 'Account created successfully!';

            form.reset();

            counter.textContent = '0 / 200 characters';

            submitBtn.disabled = true;


        });














    </script>

</body>




</html>
